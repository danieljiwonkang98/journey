<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wave Bars — 물결치는 경계</title>
    <style>
      :root {
        --dim: #888;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        background: #fff;
        color: #111;
        font-family:
          "Helvetica Neue", Helvetica, "Apple SD Gothic Neo", sans-serif;
        overflow: hidden;
      }
      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
      }
      .hud {
        position: fixed;
        left: 20px;
        bottom: 20px;
        display: flex;
        align-items: center;
        gap: 16px;
        flex-wrap: wrap;
        background: rgba(255, 255, 255, 0.85);
        border: 1px solid #e2e2e2;
        padding: 12px 16px;
        backdrop-filter: blur(8px);
        font-size: 12px;
        user-select: none;
        max-width: calc(100vw - 40px);
      }
      .hud label {
        color: var(--dim);
        display: flex;
        align-items: center;
        gap: 8px;
        white-space: nowrap;
        cursor: pointer;
      }
      .hud input[type="range"] {
        width: 84px;
        accent-color: #111;
        height: 2px;
      }
      .hud button {
        background: #111;
        color: #fff;
        border: 0;
        padding: 8px 16px;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
      }
      .hud button.rec {
        background: #e33 !important;
        color: #fff !important;
      }
      .tag {
        position: fixed;
        left: 20px;
        top: 20px;
        font-size: 11px;
        letter-spacing: 0.14em;
        color: var(--dim);
        text-transform: uppercase;
        mix-blend-mode: difference;
        color: #888;
      }
      .timer {
        color: #e33;
        font-variant-numeric: tabular-nums;
        display: none;
      }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div class="tag">WAVE BARS · SLOW TIDE</div>
    <div class="hud">
      <label
        >바 간격 <input id="pitch" type="range" min="18" max="70" value="38"
      /></label>
      <label
        >속도 <input id="speed" type="range" min="10" max="200" value="55"
      /></label>
      <label
        >파동 <input id="amp" type="range" min="20" max="160" value="80"
      /></label>
      <label
        >겹침 <input id="reach" type="range" min="40" max="200" value="110"
      /></label>
      <button id="recBtn">● 녹화 (WebM)</button>
      <span class="timer" id="timer">00:00</span>
    </div>

    <script>
      const canvas = document.getElementById("c");
      const ctx = canvas.getContext("2d");
      let W, H, DPR;
      function resize() {
        DPR = Math.min(window.devicePixelRatio || 1, 2);
        W = canvas.width = innerWidth * DPR;
        H = canvas.height = innerHeight * DPR;
        canvas.style.width = innerWidth + "px";
        canvas.style.height = innerHeight + "px";
      }
      addEventListener("resize", resize);
      resize();

      const params = { pitch: 38, speed: 0.55, amp: 80, reach: 110 };
      document.getElementById("pitch").oninput = (e) =>
        (params.pitch = +e.target.value);
      document.getElementById("speed").oninput = (e) =>
        (params.speed = +e.target.value / 100);
      document.getElementById("amp").oninput = (e) =>
        (params.amp = +e.target.value);
      document.getElementById("reach").oninput = (e) =>
        (params.reach = +e.target.value);

      // 바마다 고정된 미세 편차 (레퍼런스처럼 길이가 제각각이도록)
      const JIT = [];
      {
        let seed = 13;
        const rand = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
        for (let i = 0; i < 600; i++)
          JIT.push([rand() * 2 - 1, rand() * 2 - 1, rand() * 6.28]);
      }

      // 느리게 진행하는 파동 여러 겹의 합 — '천천히 물결'의 핵심
      function wave(i, t, layer) {
        if (layer === 0)
          // 큰 흐름 (경계선 자체의 굽이침)
          return (
            Math.sin(i * 0.045 + t * 0.3) * 1.0 +
            Math.sin(i * 0.021 - t * 0.17 + 2.1) * 0.7
          );
        if (layer === 1)
          // 검은 바 길이
          return (
            Math.sin(i * 0.55 + t * 0.55 + JIT[i % 600][2]) * 0.55 +
            Math.sin(i * 0.19 - t * 0.33 + 1.3) * 0.45 +
            JIT[i % 600][0] * 0.45
          );
        // 흰 바 길이
        return (
          Math.sin(i * 0.48 - t * 0.47 + JIT[(i + 37) % 600][2]) * 0.55 +
          Math.sin(i * 0.16 + t * 0.28 + 4.0) * 0.45 +
          JIT[(i + 37) % 600][1] * 0.45
        );
      }

      let t = 0,
        last = performance.now();

      // 지퍼형 경계: 검은 이빨(아래로 볼록)과 흰 이빨(위로 볼록)이 교대로 맞물린
      // 단일 경계 곡선을 하나의 패스로 그린다 — 레퍼런스의 막대 파형 구조 그대로
      function clamp(v, a, b) {
        return Math.min(Math.max(v, a), b);
      }

      function frame(now) {
        requestAnimationFrame(frame);
        const dt = Math.min((now - last) / 1000, 0.05);
        last = now;
        t += dt * params.speed;

        const tw = params.pitch * DPR * 0.5; // 이빨(막대) 하나의 폭
        const r = tw / 2;
        const amp = params.amp * DPR;
        const reach = params.reach * DPR;
        const n = Math.ceil(W / tw) + 2;
        const baseY = H * 0.45;

        ctx.fillStyle = "#fff";
        ctx.fillRect(0, 0, W, H);

        ctx.fillStyle = "#000";
        ctx.beginPath();
        ctx.moveTo(-tw, 0);

        for (let k = -1; k <= n; k++) {
          const x = k * tw;
          const mid = baseY + wave(k * 0.5, t, 0) * amp;
          if ((k & 1) === 0) {
            // 검은 이빨: 아래로 내려가 둥근 끝
            const f = clamp(
              0.15 + 0.85 * (0.5 + 0.5 * wave(k, t, 1)),
              0.12,
              0.95,
            );
            const tip = mid + reach * f;
            ctx.lineTo(x, tip - r);
            ctx.arc(x + r, tip - r, r, Math.PI, 0, true); // 아래쪽 반원
          } else {
            // 흰 이빨: 위로 올라가 둥근 끝 (검은 속으로 파고듦)
            const f = clamp(
              0.15 + 0.85 * (0.5 + 0.5 * wave(k, t, 2)),
              0.12,
              0.95,
            );
            const tip = mid - reach * f;
            ctx.lineTo(x, tip + r);
            ctx.arc(x + r, tip + r, r, Math.PI, 0, false); // 위쪽 반원
          }
        }

        ctx.lineTo((n + 1) * tw, 0);
        ctx.closePath();
        ctx.fill();
      }
      requestAnimationFrame(frame);

      // ---------- 녹화 ----------
      const recBtn = document.getElementById("recBtn");
      const timerEl = document.getElementById("timer");
      let recorder = null,
        chunks = [],
        t0 = 0,
        tick = null;
      recBtn.onclick = () => {
        if (recorder) {
          recorder.stop();
          return;
        }
        const stream = canvas.captureStream(60);
        const mime = MediaRecorder.isTypeSupported("video/webm;codecs=vp9")
          ? "video/webm;codecs=vp9"
          : "video/webm";
        recorder = new MediaRecorder(stream, {
          mimeType: mime,
          videoBitsPerSecond: 12_000_000,
        });
        chunks = [];
        recorder.ondataavailable = (e) => e.data.size && chunks.push(e.data);
        recorder.onstop = async () => {
          const blob = new Blob(chunks, { type: "video/webm" });
          recorder = null;
          recBtn.textContent = "● 녹화 (WebM)";
          recBtn.classList.remove("rec");
          timerEl.style.display = "none";
          clearInterval(tick);
          if (window.showSaveFilePicker) {
            try {
              const handle = await showSaveFilePicker({
                suggestedName: "wave-bars.webm",
                types: [
                  {
                    description: "WebM video",
                    accept: { "video/webm": [".webm"] },
                  },
                ],
              });
              const w = await handle.createWritable();
              await w.write(blob);
              await w.close();
              return;
            } catch (e) {}
          }
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = "wave-bars.webm";
          a.textContent = "↓ 영상 저장";
          a.style.cssText =
            "color:#e33;font-weight:600;text-decoration:underline";
          const old = document.getElementById("dlLink");
          if (old) old.remove();
          a.id = "dlLink";
          recBtn.after(a);
          try {
            a.click();
          } catch (e) {}
        };
        recorder.start();
        t0 = Date.now();
        recBtn.textContent = "■ 정지 & 저장";
        recBtn.classList.add("rec");
        timerEl.style.display = "inline";
        tick = setInterval(() => {
          const s = Math.floor((Date.now() - t0) / 1000);
          timerEl.textContent =
            String(Math.floor(s / 60)).padStart(2, "0") +
            ":" +
            String(s % 60).padStart(2, "0");
        }, 250);
      };
    </script>
  </body>
</html>
